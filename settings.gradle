pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'CreateLargeLights'

// Create: Media Systems comes as its released jar (build.gradle). To build against its source instead (a change
// to CMS not yet released), give its folder: -PcmsPath=../Create-Media-Systems
def cmsPath = providers.gradleProperty('cmsPath')
if (cmsPath.isPresent()) {
    includeBuild(cmsPath.get()) {
        dependencySubstitution {
            substitute module('org.haruyq:create_media_systems') using project(':')
        }
    }
}
