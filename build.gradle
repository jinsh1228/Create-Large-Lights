plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    // Create: Media Systems' releases on GitHub, each with its jar.
    ivy {
        name = 'Create: Media Systems releases'
        url = 'https://github.com/haruyq/Create-Media-Systems/releases/download/'
        patternLayout {
            artifact 'v[revision]/[module]-[revision].[ext]'
        }
        metadataSources {
            artifact()
        }
        content {
            includeModule('org.haruyq', 'create_media_systems')
        }
    }
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
    maven {
        url = 'https://maven.ryanhcode.dev/releases'
        content { includeGroup 'dev.ryanhcode.sable-companion' }
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

// A world with a hall lit by floodlights, built and photographed by itself (src/demo): -Pdemo, then runClient.
if (providers.gradleProperty('demo').isPresent()) {
    sourceSets.main.java.srcDir('src/demo/java')
    neoForge.runs.client {
        gameDirectory = file('run-demo')
        systemProperty 'createLargeLights.demo', 'true'
        systemProperty 'createLargeLights.demo.noScreenshots', providers.gradleProperty('externalCaptures').isPresent().toString()
        programArguments.addAll('--width', '1280', '--height', '720')
    }
}

// Focused rendering regression scene for non-cubic blocks: -PshapeDemo runClient.
if (providers.gradleProperty('shapeDemo').isPresent() || providers.gradleProperty('fieldDemo').isPresent()
        || providers.gradleProperty('productionDemo').isPresent() || providers.gradleProperty('farDemo').isPresent()) {
    sourceSets.main.java.srcDir('src/shapeDemo/java')
    neoForge.runs.client {
        gameDirectory = file('run-shapes')
        systemProperty 'createLargeLights.shapeDemo', 'true'
        systemProperty 'createLargeLights.fieldDemo', providers.gradleProperty('fieldDemo').isPresent().toString()
        systemProperty 'createLargeLights.productionDemo', providers.gradleProperty('productionDemo').isPresent().toString()
        systemProperty 'createLargeLights.farDemo', providers.gradleProperty('farDemo').isPresent().toString()
        systemProperty 'createLargeLights.farDistance', providers.gradleProperty('farDistance').getOrElse('128')
        programArguments.addAll('--width', '1280', '--height', '720')
    }
}

// Isolated CPU/GPU visibility comparison; this does not enable the prototype in a release build.
def gpuDemo = providers.gradleProperty('gpuDemo').isPresent()
def cmsOnlyDemo = gpuDemo && providers.gradleProperty('gpuMode').getOrElse('gpu') == 'cms'
if (gpuDemo) {
    sourceSets.main.java.srcDirs('src/shapeDemo/java', 'src/gpuDemo/java')
    sourceSets.main.resources.srcDir('src/gpuDemo/resources')
    neoForge.runs.client {
        gameDirectory = file('run-gpu-demo')
        systemProperty 'createLargeLights.shapeDemo', 'true'
        systemProperty 'createLargeLights.gpuDemo', 'true'
        systemProperty 'createLargeLights.gpuDemo.mode', providers.gradleProperty('gpuMode').getOrElse('gpu')
        systemProperty 'createLargeLights.gpuDemo.shadowSize', providers.gradleProperty('shadowSize').getOrElse('1024')
        systemProperty 'createLargeLights.gpuDemo.lightCount', providers.gradleProperty('gpuLights').getOrElse('1')
        systemProperty 'createLargeLights.gpuDemo.angle', providers.gradleProperty('gpuAngle').getOrElse('oblique')
        programArguments.addAll('--width', '1280', '--height', '720')
    }
}

// The CMS comparison uses its native model/raycast path. Always restore the original config on mode changes.
tasks.named('processResources', ProcessResources) {
    inputs.property 'cmsOnlyDemo', cmsOnlyDemo
    doLast {
        def source = file('src/main/resources/create_large_lights.mixins.json').getText('UTF-8')
        if (cmsOnlyDemo) {
            def config = new groovy.json.JsonSlurper().parseText(source)
            config.client.removeAll(['LightingRaycastMixin', 'LightingSurfaceScanMixin', 'LightModelDataMixin'])
            source = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(config))
        }
        new File(destinationDir, 'create_large_lights.mixins.json').write(source, 'UTF-8')
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Create: Media Systems: its release, or its source with -PcmsPath (settings.gradle).
    implementation("org.haruyq:create_media_systems:${cms_version}")

    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") {
        transitive = false
    }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.vanillin:vanillin-neoforge-${minecraft_version}:${vanillin_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")

    testImplementation(platform('org.junit:junit-bom:5.11.4'))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        loader_version_range: loader_version_range,
        create_mod_version: create_mod_version,
        cms_version_range: cms_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version,
        mod_authors: mod_authors,
        mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    inputs.property 'gpuDemo', gpuDemo
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
    if (gpuDemo) {
        doLast {
            file('build/generated/sources/modMetadata/META-INF/neoforge.mods.toml').append(
                    '\n[[mixins]]\nconfig="create_large_lights_gpu_demo.mixins.json"\n')
        }
    }
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add '-Xlint:deprecation'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

idea.module {
    downloadSources = true
}
